<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content" type="overlay">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Experiments</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false" *ngFor="let e of experiments">
            <ion-item
              [routerLink]="e.path"
              routerDirection="root"
              routerLinkActive="selected"
              detail="false"
            >
              <ion-icon slot="start" [name]="e.icon" aria-hidden="true"></ion-icon>
              <ion-label>{{ e.label }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
